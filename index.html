<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#173b68">
<title>Class 11 Physics</title>
<style>
:root{--ink:#182943;--muted:#61728a;--blue:#2563eb;--paper:#f3f7fc}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
.hero{padding:36px 20px 42px;color:#fff;background:linear-gradient(125deg,#173b68,#2869a6 65%,#18a18e)}
.wrap{max-width:900px;margin:auto}
.kicker{text-transform:uppercase;letter-spacing:.13em;font-size:.76rem;font-weight:800;opacity:.82}
h1{font-size:clamp(2rem,7vw,3.1rem);margin:8px 0 6px;line-height:1.1}
.hero p{margin:0;color:#e3efff;font-size:1.02rem}
main{max-width:900px;margin:26px auto;padding:0 16px 40px}
.unit-heading{display:flex;align-items:center;gap:12px;margin:0 0 15px;font-size:1.45rem}
.unit-heading:before{content:"";width:8px;height:30px;border-radius:8px;background:#f59e0b}
.card{display:flex;align-items:center;justify-content:space-between;gap:18px;background:#fff;border:1px solid #e0e8f2;border-radius:18px;padding:20px;box-shadow:0 8px 24px #18385a0c}
.icon{width:54px;height:54px;flex:0 0 54px;border-radius:15px;display:grid;place-items:center;background:#fff2d9;font-size:1.7rem}
.details{flex:1;min-width:0}
.details h3{margin:0 0 6px;font-size:1.15rem}
.details p{margin:0;color:var(--muted);line-height:1.5;font-size:.94rem}
.open{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:11px 17px;border-radius:12px;background:var(--blue);color:#fff;text-decoration:none;font-weight:750;white-space:nowrap}
.open:hover{background:#194fc4}
footer{text-align:center;color:#8290a3;font-size:.82rem;margin-top:28px}
@media(max-width:560px){.hero{padding:30px 18px 34px}.card{align-items:flex-start;flex-wrap:wrap;padding:16px;gap:13px}.details{flex-basis:calc(100% - 70px)}.open{width:100%}main{margin-top:22px}}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
  <div class="kicker">Learn · Explore · Understand</div>
  <h1>Class 11 Physics</h1>
  <p>Interactive lessons and simulations to make physics easier to understand.</p>
</div></header>
<main>
  <h2 class="unit-heading">Friction</h2>
  <article class="card">
    <div class="icon" aria-hidden="true">📐</div>
    <div class="details">
      <h3>Angle of Repose</h3>
      <p>Explore how the angle of an inclined plane determines when a block just begins to slide.</p>
    </div>
    <a class="open" href="friction-angle-of-repose.html">Open lesson&nbsp; →</a>
  </article>
  <footer>Class 11 Physics · Interactive learning</footer>
</main>
</body>
</html>
